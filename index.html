<!DOCTYPE html>
<html>
<head><title>Bharat-Bio Shield 33 | Live Bank Demo</title>
<style>body{font-family:Arial;background:#f0f2f5;text-align:center;padding:30px} .card{background:white;padding:20px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1);max-width:400px;margin:auto} input{width:90%;padding:12px;margin:10px;border-radius:8px;border:1px solid #ccc} button{background:#0a3d62;color:white;padding:12px 20px;border:none;border-radius:8px;width:95%} #result{margin-top:20px;font-weight:bold;font-size:18px}</style>
</head>
<body>
<div class="card">
<h2>🛡️ Bharat-Bio Shield 33</h2>
<p>International Level - Behavioural Biometrics + Mule Detection</p>
<input id="amt" placeholder="Type Amount (Eg: 50000)" onkeydown="down()" onkeyup="up()">
<input id="acc" placeholder="Enter Account No (Try: 9876543210)">
<button onclick="check()">Transfer Money</button>
<p id="result"></p>
<p style="font-size:12px;color:gray">Demo: Mule Acc - 9876543210 | Founder: Sai from Kakinada for Bharat</p>
</div>
<script>
let dTime, dwell=[], flight=[], lastUp=0;
function down(){dTime=Date.now(); if(lastUp)flight.push((Date.now()-lastUp)/1000)}
function up(){dwell.push((Date.now()-dTime)/1000); lastUp=Date.now()}
async function check(){
let avgD=dwell.reduce((a,b)=>a+b,0)/dwell.length||0.12;
let avgF=flight.reduce((a,b)=>a+b,0)/flight.length||0.15;
let res=await fetch('/verify-transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_no:document.getElementById('acc').value,dwell_time:avgD,flight_time:avgF})});
let data=await res.json();
document.getElementById('result').innerText=data.result+" - "+data.reason;
document.getElementById('result').style.color=data.result=="BLOCKED"?"red":"green";
}
</script>
</body>
</html>
